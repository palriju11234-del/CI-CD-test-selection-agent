name: CI Test Selection

on:
  push:
  pull_request:

jobs:
  test-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-json-report pandas stable-baselines3 gymnasium GitPython

      - name: Run Test Selection Agent
        run: |
          python src/live_agent.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_REPO_PATH: ${{ github.workspace }}/data/synthetic/demo_repo
          PYTHONUNBUFFERED: "1"