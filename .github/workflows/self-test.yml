name: CI Test Selection

on:
  push:
  pull_request:

jobs:
  test-selection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # CRITICAL: GitHub does a shallow clone (depth 1) by default. 
          # We need at least 2 commits so ChangeAnalyzer can run 'git diff HEAD~1'.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure test tools are explicitly available in the runner
          pip install pytest pytest-json-report
          pip install pytest pytest-json-report pandas stable-baselines3 gymnasium GitPython

        name: Run Test Selection Agent
        run: |
          python src/live_agent.py
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Force the GitHub Actions provider to target the synthetic repo
          GITHUB_WORKSPACE: ${{ github.workspace }}/data/synthetic/demo_repo
          PYTHONPATH: ${{ github.workspace }}